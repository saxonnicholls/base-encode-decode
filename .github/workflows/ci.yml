name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64: exercise the Intel SSSE3 kernels (-mssse3, since the plain
          # x86-64 baseline does not enable SSSE3) under both GCC and Clang.
          - name: linux-x86-gcc
            os: ubuntu-latest
            cxx: g++
            simd: Intel SSSE3
            extra: -mssse3
          - name: linux-x86-clang
            os: ubuntu-latest
            cxx: clang++
            simd: Intel SSSE3
            extra: -mssse3
          # aarch64: NEON is baseline, no extra flags needed.
          - name: linux-arm-gcc
            os: ubuntu-24.04-arm
            cxx: g++
            simd: ARM NEON
            extra: ""
          - name: linux-arm-clang
            os: ubuntu-24.04-arm
            cxx: clang++
            simd: ARM NEON
            extra: ""
          # Apple clang on both architectures (macos-latest is arm64,
          # macos-15-intel is the last free x86 image, supported to Aug 2027).
          - name: macos-arm-clang
            os: macos-latest
            cxx: clang++
            simd: ARM NEON
            extra: ""
          - name: macos-x86-clang
            os: macos-15-intel
            cxx: clang++
            simd: Intel SSSE3
            extra: -mssse3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The single include holds every public header
        run: python3 third_party/tooling/scripts/single_include.py --check

      - name: Compiler version
        run: ${{ matrix.cxx }} --version

      # Runs the suite twice: SIMD build and forced-scalar (-DSNICHOLLS_NO_SIMD) build.
      - name: Build and test
        run: make test CXX='${{ matrix.cxx }}' CXXFLAGS='-std=gnu++23 -O3 -Wall -Wextra ${{ matrix.extra }}'

      # Guard against silently testing scalar where SIMD was expected.
      - name: Confirm SIMD kernels are active
        run: |
          ./build/tests | grep -q "SIMD: ${{ matrix.simd }} kernels active"

      - name: Benchmark smoke test
        run: make bench CXX='${{ matrix.cxx }}' CXXFLAGS='-std=gnu++23 -O3 -Wall -Wextra ${{ matrix.extra }}' BENCH_MB=8

  cmake:
    name: cmake-ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  xcode:
    name: xcode-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run the Xcode project
        run: |
          xcodebuild -project BaseEncodeDecode.xcodeproj -scheme BaseEncodeDecode \
            -configuration Debug -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
          build/xcode/Build/Products/Debug/BaseEncodeDecode | tail -n 3

  # The single include is never committed, so it cannot be stale: on a release tag it is generated from the tagged
  # commit, compiled alone with warnings as errors, and attached to the GitHub release, once the gating legs are green
  single-include:
    name: Release the single include
    needs: [test, cmake, xcode]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Generate it from the tagged commit
        run: |
          set -euo pipefail
          python3 third_party/tooling/scripts/single_include.py --check
          python3 third_party/tooling/scripts/single_include.py --out "$RUNNER_TEMP/single_include"
          ls -l "$RUNNER_TEMP/single_include"

      - name: It compiles alone, warnings as errors
        run: |
          printf '#include "snicholls_base_encode_decode.hpp"\n' > "$RUNNER_TEMP/use.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -I"$RUNNER_TEMP/single_include" "$RUNNER_TEMP/use.cpp"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "base-encode-decode $TAG" --notes "See CHANGELOG.md for $TAG."
          gh release upload "$TAG" "$RUNNER_TEMP/single_include/snicholls_base_encode_decode.hpp" --clobber
