#
#  tooling.conf
#  BaseEncodeDecode
#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). base-encode-decode takes
#  tooling's single include: single_include/snicholls_base_encode_decode.hpp, the library and core in one file.

name          = base-encode-decode
include_dir   = BaseEncodeDecode
include_root  = BaseEncodeDecode
namespace     = snicholls
umbrella      = base_encode_decode.hpp

single_include.snicholls_base_encode_decode = base_encode_decode.hpp   # the whole library, core included
single_include_inline = BaseEncodeDecode third_party/core/include
single_include_opt_in = encode_decode_json.hpp utils/encryption_openssl.hpp utils/encryption_sodium.hpp utils/kv_rocksdb.hpp   # nlohmann::json, OpenSSL, libsodium, RocksDB: each needs a third-party library
